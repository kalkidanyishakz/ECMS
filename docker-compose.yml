name: ecms

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ecms
    volumes:
      - ecms_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ecms"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  app:
    build:
      context: .
      args:
        NEXT_PUBLIC_APP_URL: http://localhost:7080
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "7080:3000"
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/ecms?schema=ecms
      BETTER_AUTH_SECRET: development-secret-key-12345
      BETTER_AUTH_URL: http://localhost:7080
      NEXT_PUBLIC_APP_URL: http://localhost:7080
      DEEPSEEK_API_KEY: your-deepseek-api-key-here
      PGHOST: db
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: ecms
      PORT: "3000"
      HOSTNAME: 0.0.0.0
    restart: unless-stopped

volumes:
  ecms_pgdata:
